name: 🧠 Brainrot Firebase Scanner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-bot:
    name: 🚀 Мониторинг Каналов
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v3

      - name: 🐍 Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Установка библиотек
        run: |
          pip install discord.py-self requests

      - name: 🔍 Проверка Конфигурации
        run: |
          echo "=== ПРОВЕРКА НАСТРОЕК ==="
          echo "Target Channel ID: ${{ secrets.CHANNEL_ID }}"
          if [ -z "${{ secrets.FIREBASE_URL }}" ]; then echo "❌ FIREBASE_URL NOT SET"; else echo "✅ FIREBASE_URL IS SET"; fi
          echo "========================"

      - name: 🛰️ Запуск бота
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: python bot.py
