name: 🧠 Brainrot Rich Server Scanner

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запустить вручную кнопкой

jobs:
  run-bot:
    name: 🚀 Запуск Мониторинга
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v3

      - name: 🐍 Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Установка библиотек (discord.py-self)
        run: |
          pip install discord.py-self requests

      - name: 🛰️ Запуск бота в облаке
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py
