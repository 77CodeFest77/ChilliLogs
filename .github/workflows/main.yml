name: 🧠 Brainrot Firebase Scanner

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Чтобы можно было запустить вручную кнопкой

jobs:
  run-bot:
    name: 🚀 Запуск Мониторинга
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v3

      - name: 🐍 Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Установка библиотек
        run: |
          pip install discord.py-self requests

      - name: 🛰️ Запуск бота
        env:
          # Передаем секреты из настроек GitHub в код бота
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: python bot.py
